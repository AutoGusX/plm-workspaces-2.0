<!DOCTYPE html>
<!--
  PLM Workspaces 2.0 — Export Electronics BOM palette (v1: read & display + export-prep)
  Self-contained: does NOT use engine.js.
  Asset load order: tokens.css → components.css → bridge.js → theme.js → electronics_bom.js
  Relative base: commands/export_electronics_bom/resources/html/ (add-in root is 4 levels up)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Electronics BOM to PLM</title>
<link rel="stylesheet" href="../../../../web/core/tokens.css">
<link rel="stylesheet" href="../../../../web/core/components.css">
<style>
body { margin: 0; background: var(--bg); color: var(--ink-primary);
       font-family: 'Segoe UI', system-ui, sans-serif; font-size: var(--fs-sm);
       display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.ebom-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
               border-bottom: 1px solid var(--divider); background: var(--surface); flex-shrink: 0; }
.ebom-header h1 { margin: 0; font-size: var(--fs-lg); font-weight: 600; flex: 1; letter-spacing: -0.01em; }
.ebom-scroll { flex: 1; overflow-y: auto; padding: 14px; }
.summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius);
        padding: 8px 12px; min-width: 84px; }
.stat .num { font-size: var(--fs-lg); font-weight: 700; }
.stat .lbl { font-size: var(--fs-xs); color: var(--ink-muted); text-transform: uppercase; letter-spacing: .05em; }
.export-note { font-size: var(--fs-xs); color: var(--ink-muted); background: var(--accent-soft);
               border: 1px solid var(--accent-border); border-radius: var(--radius);
               padding: 8px 12px; margin-bottom: 12px; }
table.bom { width: 100%; border-collapse: collapse; background: var(--surface);
            border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; }
table.bom th, table.bom td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--divider);
                             font-size: var(--fs-xs); vertical-align: top; }
table.bom th { background: var(--surface-alt); font-weight: 600; color: var(--ink-label);
               position: sticky; top: 0; }
table.bom td.qty { text-align: right; font-variant-numeric: tabular-nums; }
.missing { color: var(--ink-muted); font-style: italic; }
.warn { color: var(--danger); font-size: var(--fs-xs); margin: 8px 0; }
.diag { margin-top: 14px; }
.diag summary { cursor: pointer; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-label); }
.diag pre { background: var(--surface-alt); border: 1px solid var(--border-soft); border-radius: var(--radius);
            padding: 10px; font-size: 11px; overflow: auto; max-height: 260px; white-space: pre-wrap;
            word-break: break-word; }
.state-msg { padding: 40px 16px; text-align: center; color: var(--ink-muted); }
.state-msg.error { color: var(--danger); }
</style>
</head>
<body>
<div class="ebom-header">
  <h1>Electronics BOM</h1>
  <button type="button" class="btn btn-sm" id="btnCopy" style="display:none;">Copy JSON</button>
  <button type="button" class="btn btn-primary btn-sm" id="btnExtract">Re-extract</button>
</div>
<div class="ebom-scroll">
  <div id="statusMsg" class="state-msg">Reading the active electronics design…</div>
  <div id="content" style="display:none;">
    <div class="summary" id="summary"></div>
    <div class="export-note" id="exportNote"></div>
    <div id="warnings"></div>
    <div id="tableWrap"></div>
    <details class="diag" id="diag">
      <summary>Export-prep payload (normalized rows for Fusion Manage)</summary>
      <pre id="diagJson"></pre>
    </details>
  </div>
</div>
<script src="../../../../web/core/bridge.js"></script>
<script src="../../../../web/core/theme.js"></script>
<script src="static/electronics_bom.js"></script>
</body>
</html>

<!DOCTYPE html>
<!--
  PLM Workspaces 2.0 — Export Electronics BOM to PLM (wizard)
  Steps: Extract -> Configure -> Preview -> Push. Self-contained (no engine.js).
  Load order: tokens.css -> components.css -> bridge.js -> theme.js -> electronics_bom.js
  Relative base: commands/export_electronics_bom/resources/html/ (add-in root 4 levels up)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Electronics BOM to PLM</title>
<link rel="stylesheet" href="../../../../web/core/tokens.css">
<link rel="stylesheet" href="../../../../web/core/components.css">
<style>
body { margin:0; background:var(--bg); color:var(--ink-primary);
       font-family:'Segoe UI',system-ui,sans-serif; font-size:var(--fs-sm);
       display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.hdr { display:flex; align-items:center; gap:8px; padding:10px 14px;
       border-bottom:1px solid var(--divider); background:var(--surface); flex-shrink:0; }
.hdr h1 { margin:0; font-size:var(--fs-lg); font-weight:600; flex:1; }
.steps { display:flex; gap:0; padding:8px 14px; background:var(--surface-alt);
         border-bottom:1px solid var(--divider); flex-shrink:0; }
.step { display:flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--ink-muted);
        padding:2px 10px; border-radius:999px; font-weight:600; }
.step.active { color:var(--accent-ink); background:var(--accent-soft); }
.step.done { color:var(--ink-primary); }
.step .n { width:16px; height:16px; border-radius:50%; background:var(--border);
           color:var(--surface); display:inline-flex; align-items:center; justify-content:center;
           font-size:10px; }
.step.active .n { background:var(--accent); } .step.done .n { background:var(--ok,#5cb85c); }
.body { flex:1; overflow-y:auto; padding:14px; }
.panel { display:none; } .panel.active { display:block; }
.footer { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--divider);
          background:var(--surface); flex-shrink:0; }
.footer .spacer { flex:1; }
.state-msg { padding:30px 16px; text-align:center; color:var(--ink-muted); }
.state-msg.error { color:var(--danger); }
.summary { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.stat { background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
        padding:6px 10px; min-width:70px; } .stat .num { font-size:var(--fs-md); font-weight:700; }
.stat .lbl { font-size:10px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; }
table.grid { width:100%; border-collapse:collapse; background:var(--surface);
             border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden; }
table.grid th, table.grid td { text-align:left; padding:5px 9px; border-bottom:1px solid var(--divider);
             font-size:var(--fs-xs); vertical-align:top; }
table.grid th { background:var(--surface-alt); font-weight:600; color:var(--ink-label);
             position:sticky; top:0; }
td.qty { text-align:right; font-variant-numeric:tabular-nums; }
.missing { color:var(--ink-muted); font-style:italic; }
.pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:10px; font-weight:700; }
.pill.create { background:#e6f4ea; color:#1e7e34; } .pill.update { background:#e7f0fb; color:#1b5fb0; }
.pill.add { background:#e6f4ea; color:#1e7e34; } .pill.remove { background:#fdeaea; color:#c62828; }
.pill.noop,.pill.match,.pill.skip { background:var(--surface-alt); color:var(--ink-muted); }
.pill.ok { background:#e6f4ea; color:#1e7e34; } .pill.err { background:#fdeaea; color:#c62828; }
.warn { color:#b26a00; font-size:var(--fs-xs); margin:6px 0; }
.cfg-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.cfg-row label { width:150px; font-weight:600; font-size:var(--fs-xs); color:var(--ink-label); }
.cfg-row select, .cfg-row input { flex:1; padding:4px 6px; border:1px solid var(--border);
             border-radius:4px; background:var(--surface); color:var(--ink-primary); font-size:var(--fs-xs); }
.cfg-section-title { font-size:var(--fs-xs); font-weight:700; text-transform:uppercase;
             letter-spacing:.05em; color:var(--ink-label); margin:14px 0 8px; }
</style>
</head>
<body>
<div class="hdr"><h1>Export Electronics BOM</h1><span id="designName" style="color:var(--ink-muted);font-size:var(--fs-xs);"></span></div>
<div class="steps" id="steps">
  <div class="step" data-step="extract"><span class="n">1</span>Extract</div>
  <div class="step" data-step="configure"><span class="n">2</span>Configure</div>
  <div class="step" data-step="preview"><span class="n">3</span>Preview</div>
  <div class="step" data-step="results"><span class="n">4</span>Push</div>
</div>
<div class="body">
  <div id="statusMsg" class="state-msg">Reading the active electronics design…</div>

  <div class="panel" id="panel-extract">
    <div class="summary" id="extractSummary"></div>
    <div id="extractWarnings"></div>
    <div id="extractTable"></div>
  </div>

  <div class="panel" id="panel-configure">
    <div class="cfg-section-title">Target workspaces</div>
    <div class="cfg-row"><label>Items (components)</label><select id="wsItems"></select></div>
    <div class="cfg-row"><label>MPN records</label><select id="wsMpn"></select></div>
    <div class="cfg-row"><label>Suppliers</label><select id="wsSupplier"></select></div>
    <div class="cfg-section-title">Component field mapping (Items workspace)</div>
    <div id="itemMapRows"></div>
    <div class="cfg-row"><label>Title from</label>
      <select id="titleSource">
        <option value="mpn">MPN</option>
        <option value="value">Value</option>
        <option value="footprint">Footprint</option>
        <option value="description">Description</option>
        <option value="composed">Composed…</option>
      </select></div>
    <div class="cfg-row" id="titleTemplateRow" style="display:none;">
      <label>Title template</label><input id="titleTemplate" placeholder="{mpn} — {value}"></div>
    <div class="cfg-section-title">BOM row mapping</div>
    <div class="cfg-row"><label>Reference designators →</label><select id="refDesField"></select></div>
    <div class="cfg-section-title">Parent &amp; files</div>
    <div class="cfg-row"><label>Parent key field</label><input id="parentKeyField"></div>
    <div class="cfg-row"><label>Sync design files</label>
      <span style="flex:1;"><label style="font-weight:400;"><input type="checkbox" id="syncFiles">
        Also attach EAGLE .sch/.brd (zipped) to the parent item</label></span></div>
    <div id="cfgMsg" class="warn"></div>
  </div>

  <div class="panel" id="panel-preview">
    <div class="summary" id="planCounts"></div>
    <div id="planParent" style="margin-bottom:10px;font-size:var(--fs-xs);color:var(--ink-muted);"></div>
    <div id="planTable"></div>
    <div id="planRemovals"></div>
  </div>

  <div class="panel" id="panel-results">
    <div class="summary" id="pushCounts"></div>
    <div id="pushWarnings"></div>
    <div id="pushFiles"></div>
    <div id="pushTable"></div>
  </div>
</div>
<div class="footer" id="footer">
  <button type="button" class="btn" id="btnBack" style="display:none;">Back</button>
  <span class="spacer"></span>
  <span id="footMsg" style="align-self:center;font-size:var(--fs-xs);color:var(--ink-muted);"></span>
  <button type="button" class="btn btn-primary" id="btnNext">Next: Configure</button>
</div>
<script src="../../../../web/core/bridge.js"></script>
<script src="../../../../web/core/theme.js"></script>
<script src="static/electronics_bom.js"></script>
</body>
</html>

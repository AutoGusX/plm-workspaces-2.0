<!DOCTYPE html>
<!--
  PLM Workspaces 2.0 — PLM Charts palette
  Self-contained: does NOT use engine.js or window._plmCfg.
  Asset load order: tokens.css → components.css → bridge.js → theme.js → plm_charts.js
  Relative base: commands/plm_charts/resources/html/  (add-in root is 4 levels up)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLM Charts</title>
<link rel="stylesheet" href="../../../../web/core/tokens.css">
<link rel="stylesheet" href="../../../../web/core/components.css">
<style>
body { margin: 0; background: var(--bg); color: var(--ink-primary);
       font-family: 'Segoe UI', system-ui, sans-serif; font-size: var(--fs-sm);
       display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.charts-header {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--divider); background: var(--surface); flex-shrink: 0;
}
.charts-header h1 { margin: 0; font-size: var(--fs-lg); font-weight: 600; flex: 1;
                    letter-spacing: -0.01em; }
.charts-scroll { flex: 1; overflow-y: auto; padding: 14px; }
.chart-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 620px) { .chart-grid { grid-template-columns: 1fr 1fr; } }
.chart-card {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); box-shadow: var(--shadow-xs); overflow: hidden;
    display: flex; flex-direction: column; min-height: 240px;
}
.chart-card-head {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-bottom: 1px solid var(--border-soft); background: var(--surface-alt);
}
.chart-card-title { font-size: var(--fs-sm); font-weight: 600; flex: 1;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart-type-pill { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-muted);
                   border: 1px solid var(--border-soft); border-radius: 999px;
                   padding: 1px 8px; text-transform: capitalize; }
.chart-open-btn { background: none; border: none; cursor: pointer; color: var(--ink-muted);
                  padding: 2px 4px; border-radius: 4px; display: inline-flex; }
.chart-open-btn:hover { color: var(--accent); background: var(--accent-soft); }
.chart-body { flex: 1; padding: 10px 12px 12px; display: flex; flex-direction: column;
              align-items: center; justify-content: center; min-height: 190px; }
.chart-body svg { width: 100%; height: auto; display: block; }
.chart-msg { color: var(--ink-muted); font-size: var(--fs-xs); text-align: center; padding: 20px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px;
                justify-content: center; }
.chart-legend span { display: inline-flex; align-items: center; gap: 5px;
                     font-size: var(--fs-xs); color: var(--ink-label); }
.chart-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.state-msg { padding: 40px 16px; text-align: center; color: var(--ink-muted); }
.state-msg.error { color: var(--danger); }
</style>
</head>
<body>
<div class="charts-header">
  <h1>PLM Charts</h1>
  <button type="button" class="btn btn-sm" id="btnRefresh">Refresh</button>
</div>
<div class="charts-scroll">
  <div id="statusMsg" class="state-msg">Loading dashboard…</div>
  <div class="chart-grid" id="chartGrid"></div>
</div>
<script src="../../../../web/core/bridge.js"></script>
<script src="../../../../web/core/theme.js"></script>
<script src="static/plm_charts.js"></script>
</body>
</html>
